<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Esri Maps JS API with NGD Tiles</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.25/esri/themes/light/main.css">
    <script src="https://js.arcgis.com/4.25/"></script>
    <style>
        html, body, #viewDiv {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="viewDiv"></div>
    <script>
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/layers/TileLayer"
        ], function(Map, MapView, TileLayer) {
            // Create a TileLayer with NGD Tiles API
            const ngdTilesLayer = new TileLayer({
                url: "https://tiles.arcgis.com/tiles/your-org-id/arcgis/rest/services/NGD_Tiles/MapServer",
                apiKey: "GcutoH6iGgDCNdvz3L8c4cCFwzLpAAZr"
            });

            // Create a map and add the NGD Tiles layer
            const map = new Map({
                basemap: "streets",
                layers: [ngdTilesLayer]
            });

            // Create a MapView and set its properties
            const view = new MapView({
                container: "viewDiv",
                map: map,
                center: [-2.2426, 53.4808], // Longitude, Latitude (Manchester, UK)
                zoom: 10
            });
        });
    </script>
</body>
</html>
