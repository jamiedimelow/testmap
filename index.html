<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OS Vector Tiles Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialize the map
        const map = L.map('map').setView([53.4808, -2.2426], 13); // Centered on Manchester, UK

        // Add OS Vector Tiles layer
        L.tileLayer('https://api.os.uk/maps/vector/v1/vts/tile/{z}/{x}/{y}.pbf?key=GcutoH6iGgDCNdvz3L8c4cCFwzLpAAZr', {
            attribution: '&copy; Ordnance Survey',
            maxZoom: 20,
            tileSize: 512,
            zoomOffset: -1
        }).addTo(map);
    </script>
</body>
</html>
