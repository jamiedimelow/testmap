<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>OS Vector Tile API | Basic Map (EPSG:3857) | ArcGIS Maps SDK for JavaScript</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/OrdnanceSurvey/os-api-branding@0.3.1/os-api-branding.css" />
    <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
    <style>
      html,
      body,
      #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
      .esri-ui .esri-attribution {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="viewDiv"></div>

    <script src="https://cdn.jsdelivr.net/gh/OrdnanceSurvey/os-api-branding@0.3.1/os-api-branding.js" data-div="viewDiv" data-prefix="Powered by Esri"></script>
    <script src="https://js.arcgis.com/4.30/"></script>
    <script>

      const apiKey = 'GcutoH6iGgDCNdvz3L8c4cCFwzLpAAZr';

      const vectorTileServiceUrl = 'https://api.os.uk/maps/vector/v1/vts';
      const featuresServiceUrl = 'https://api.os.uk/features/v1/wfs';

      require([
        "esri/Map",
        "esri/views/MapView",
        "esri/layers/VectorTileLayer",
        "esri/layers/FeatureLayer",
        "esri/config"
      ], function(Map, MapView, VectorTileLayer, FeatureLayer, esriConfig) {
        // Add the 'key' and 'srs' options to the request URL before it is sent.
        esriConfig.request.interceptors.push({
          urls: [vectorTileServiceUrl, featuresServiceUrl],
          before: function(params) {
            if(! params.requestOptions.query ) {
              params.requestOptions.query = {};
            }
            params.requestOptions.query.key = apiKey;
            params.requestOptions.query.srs = 3857;
          }
        });

        const tileLayer = new VectorTileLayer({
          url: vectorTileServiceUrl
        });

        const airportLayer = new FeatureLayer({
          url: `${featuresServiceUrl}?service=WFS&version=2.0.0&request=GetFeature&typeNames=Transportation.Airport`,
          fetchOptions: {
            mode: 'no-cors'
          }
        });

        const map = new Map({
          layers: [ tileLayer, airportLayer ]
        });

        const view = new MapView({
          container: "viewDiv",
          map: map,
          zoom: 6,
          center: [ -1.5, 54.0 ], // Centered on the UK
          constraints: {
            minZoom: 6,
            maxZoom: 18,
            rotationEnabled: false
          }
        });
      });

    </script>

  </body>
</html>
